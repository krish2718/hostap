# NetworkManager: do not manage wlan* (used by mac80211_hwsim tests).
# Install once so tests do not conflict with NM and so stop.sh does not kill
# NM's wpa_supplicant (install this, then use PID-based stop only):
#
#   sudo cp networkmanager-unmanage-wlan.conf /etc/NetworkManager/conf.d/
#   sudo systemctl reload NetworkManager
#
# Then run tests as usual. Your Ethernet/other interfaces are unchanged.
[keyfile]
unmanaged-devices=interface-name:wlan0;interface-name:wlan1;interface-name:wlan2;interface-name:wlan3;interface-name:wlan4;interface-name:wlan5;interface-name:wlan6;interface-name:wlan7
